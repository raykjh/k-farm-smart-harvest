packages:
  - '.'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@embedded-postgres/windows-x64': true
  # Linux hosting uses a separate PostgreSQL service, not an embedded database.
  '@embedded-postgres/linux-x64': false
  prisma: true
  esbuild: true
  sharp: true
  embedded-postgres: true
overrides:
  deepmerge-ts: 8.0.0
  source-map-js: 1.2.2
  sharp: 0.35.5
