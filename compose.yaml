services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kfarm
      POSTGRES_PASSWORD: kfarm_local_demo
      POSTGRES_DB: kfarm
    ports: ['127.0.0.1:55432:5432']
    volumes: ['kfarm-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kfarm']
      interval: 5s
      retries: 10
  solver:
    build:
      context: .
      dockerfile: solver/Dockerfile
    ports: ['127.0.0.1:8100:8100']
volumes:
  kfarm-data:
